<html>
<head>
  <!-- Circles' head scripts [REQUIRED] -->
  <circles-start-scripts/>

  <!-- my scripts -->
  <script src="scripts/robot-controls.js"></script>
  <script src="scripts/ball-generator.js"></script>
</head>
<body>
  <!-- this is used to create our enter UI that creates a 2D overlay to capture a user gesture for sound/mic access etc. -->
  <circles-start-ui/>

  <!-- a-scene with 'circles-properties' component [REQUIRED] -->
  <a-scene circles_scene_properties circles-platform-scene-shadows="updateInterval:10;">
    <a-assets>
      <img id='skyMap' src='/global/assets/textures/equirectangular/PurpleBlue.jpg' crossorigin="anonymous">

      <!-- Circles' built-in assets [REQUIRED] -->
      <circles-assets/>
    </a-assets>

    <!-- Circles' built-in manager and avatar [REQUIRED] -->
    <circles-manager-avatar/>

    <a-entity light="type:ambient; color:rgb(190,140,210)"></a-entity>
    <a-entity light="type:directional; color:#FFF; intensity:0.6" circles-platform-shadows position="-0.5 1 1"></a-entity>

    <!-- object to play with -->
    <a-entity id="torus_knot" position="3 1 -3"
              geometry="primitive:torusKnot; radius:0.5; radiusTubular:0.07; segmentsTubular:128; segmentsRadial:16;"
              material="color:yellow; emissive:red; emissiveIntensity:0.7; metalness:0.3; roughness:0.8;" 
              circles-pickup-object="pickupScale:0.5 0.5 0.5;"
              circles-pickup-networked 
              shadow="cast:true; receive:true;"></a-entity>
    
    <!-- artefact to play with -->
    <a-entity id="artefact-gem"
                position="-3 1 -3" rotation="0 0 0" scale="1 1 1"
                geometry="primitive:octahedron; radius:0.5;"
                material="color:blue; emissive:green; emissiveIntensity:0.7; metalness:0.3; roughness:0.8;" 
                circles-artefact="inspectPosition:0 0 0; inspectRotation:0 0 0; inspectScale:0.8 0.8 0.8;
                                  textRotationY:90.0; labelLookAt:true; descriptionLookAt:true; label_offset:0.0 1.0 0.0; arrow_position:down;
                                  title:[~20-25 chars] Title Front;
                                  description:[~240-280 chars]  This is the FRONT text that will display when an object is picked up. Adjust scale size and text rotation properties to make more visible.;
                                  title_back:[~20-25 chars] Title Back;
                                  description_back:[~240-280 chars] This is the back/secondary text that will display when you rotate the description bubble.;
                                  label_text:Gem;"
                circles-pickup-networked></a-entity>

    <!-- robot arm test -->
    <a-entity id="robot_arm" position="0 0 -6">
      <a-entity class="pivot shoulder left right" position="0 0 0">
        <a-entity class="pivot shoulder over back" position="0 0 0">
          <a-entity id="robot_shoulder" circles-networked-basic geometry="primitive:sphere; radius:0.3;" material="color:orange;"></a-entity>
            <a-entity class="arm_upper" position="0 1 0">
              <a-entity id="robot_arm_upper" circles-networked-basic geometry="primitive:box; width:0.3; depth:0.3; height:2.0;" material="color:orange;"></a-entity>
              <a-entity class="pivot elbow left right" position="0 1 0">
                <a-entity class="pivot elbow over back" position="0 0 0">
                  <a-entity id="robot_elbow" circles-networked-basic geometry="primitive:sphere; radius:0.25;" material="color:orange;"></a-entity>
                    <a-entity class="arm_lower" position="0 0.75 0">
                      <a-entity id="robot_arm_lower" circles-networked-basic geometry="primitive:box; width:0.3; depth:0.3; height:1.5;" material="color:orange;"></a-entity>
                        <a-entity class="hand" position="0 0.75 0">
                          <a-entity id="robot_hand" circles-networked-basic geometry="primitive:dodecahedron; radius:0.5;" material="color:orange;"></a-entity>
                          </a-entity>
                        </a-entity>
                      </a-entity>
                    </a-entity>
                  </a-entity>
                </a-entity>
              </a-entity>
            </a-entity>

    <a-entity id="robot_controls" robot-controls position="0 0 -2">
      <a-entity class="control_box" position="0 0.1 0" rotation="30 0 0" geometry="primitive:box; height:1.0; width:2.0; depth:1.0;" material="color:rgb(200,200,200);"></a-entity>
      <a-entity position="-0.4 0.64 -0.25" geometry="primitive:box; height:1.2; width:0.6; depth:0.3;" material="color:rgb(200,200,200);"></a-entity>
      <a-entity position="0.4 0.64 -0.25" geometry="primitive:box; height:1.2; width:0.6; depth:0.3;" material="color:rgb(200,200,200);"></a-entity>
      <a-entity id="display_shoulder" circles-networked-basic position="-0.4 1.0 -0.09" geometry="primitive:plane; width:0.4; height:0.285;" material="color:rgb(32, 72, 41);" text="value:Initializing ...\n\n\n; color:rgb(146, 229, 161); wrapCount:10;;"></a-entity>
      <a-entity id="display_elbow" circles-networked-basic position="0.4 1.0 -0.09" geometry="primitive:plane; width:0.4; height:0.285;" material="color:rgb(32, 72, 41);" text="value:Initializing ...\n\n\n; color:rgb(146, 229, 161); wrapCount:10;;"></a-entity>
      <a-entity class="shoulder controls" position="-0.4 0.5 0.2" rotation="30 0 0">
        <a-entity class="shoulder over button"  position="0 0 0.2"  scale="0.5 0.5 0.5" circles-button="pedastal_visible:false;"></a-entity>
        <a-entity class="shoulder back button"  position="0 0 -0.2" scale="0.5 0.5 0.5" circles-button="pedastal_visible:false;"></a-entity>
        <a-entity class="shoulder left button"  position="-0.2 0 0" scale="0.5 0.5 0.5" circles-button="pedastal_visible:false;"></a-entity>
        <a-entity class="shoulder right button" position="0.2 0 0"  scale="0.5 0.5 0.5" circles-button="pedastal_visible:false;"></a-entity>
      </a-entity>
      <a-entity class="elbow controls" position="0.4 0.5 0.2" rotation="30 0 0">
        <a-entity class="elbow over button"  position="0 0 0.2"  scale="0.5 0.5 0.5" circles-button="pedastal_visible:false;"></a-entity>
        <a-entity class="elbow back button"  position="0 0 -0.2" scale="0.5 0.5 0.5" circles-button="pedastal_visible:false;"></a-entity>
        <a-entity class="elbow left button"  position="-0.2 0 0" scale="0.5 0.5 0.5" circles-button="pedastal_visible:false;"></a-entity>
        <a-entity class="elbow right button" position="0.2 0 0"  scale="0.5 0.5 0.5" circles-button="pedastal_visible:false;"></a-entity>
      </a-entity>
    </a-entity>

    <!-- ball generator -->
    <a-entity id="universal_button" position="3 0 0">
      <a-entity class="button interactive" position="0 0.6 0" geometry="primitive:cylinder; radius:0.15; height:0.2;" material="color:rgb(255, 100, 100)"
                ball-generator="ball_radius:0.2; ball_radius_deviation:0.1; spawn_position:3 1.6 0; spawn_position_deviation:0.5;"
                animation__mouseenter="property:material.color; type:color; to:rgb(255, 0, 0); startEvents:mouseenter; dur:200"
                animation__mouseleave="property:material.color; type:color; to:rgb(255, 100, 100); startEvents:mouseleave; dur:200"
                animation__click="property:position.y; from:0.55; to:0.6; startEvents:click; dur:300" shadow></a-entity>
      <a-entity position="0 0.3 0" geometry="primitive:box; width:0.5; depth:0.5; height:0.6;" material="color:rgb(255, 255, 255)" shadow></a-entity>
    </a-entity>


    <!-- Mirror for avatar changes -->
    <a-entity id="mirror" geometry="primitive:plane; width:1.6; height:2.0" position="0.0 1.5 4.5" rotation ="0, -180, 0"
      circles-platform-mirror="textureSizeDesktop:1024; textureSizeMobile:512; textureSizeHMD:1024; color:#000;"></a-entity>


    <!-- Buttons to control changing skin types -->
               <a-entity id="controls" rotation="-0.17 -0.222 49.985" position="0 1 0">

            <!-- buttons for device instruction selection -->
            <a-entity rotation="0 0 0" position="0.013 -0.011 -0.522">
              <a-entity text="value: Platform Instructions; align:center; width: 1; color: #dbdcff;" rotation="-90 -90 0" position="0.12 0.056 -0.150"></a-entity>
              <a-entity id="mobileInstructions"
                        scale="1 0.4 1"
                        position="0 0 -0.278"
                        circles-button="type: cylinder; button_color: #676ea2; button_color_hover: #5666a4; pedastal_visible: false; diameter: 0.25; false; button_color: #7d7d7d; button_color_hover: #474747"
                        circles-interactive-object="click_sound: #button_press">
                        <a-entity text="value: Mobile; align: center; width: 1.0; color: #dbdcff;" rotation="-90 -90 0" position="-0.12 0.11 0"></a-entity></a-entity>
              <a-entity id="desktopInstructions"
                        scale="1 0.4 1"
                        position="0 0 0"
                        circles-button="type: cylinder; button_color: #676ea2; button_color_hover: #5666a4; pedastal_visible: false; diameter: 0.25; false; button_color: #7d7d7d; button_color_hover: #474747"
                        circles-interactive-object="click_sound: #button_press">
                        <a-entity text="value: Desktop; align: center; width: 1.0; color: #dbdcff;" rotation="-90 -90 0" position="-0.12 0.11 0"></a-entity></a-entity>
              <a-entity id="headsetInstructions"
                        scale="1 0.4 1"
                        position="0 0 0.278"
                        circles-button="type: cylinder; button_color: #676ea2; button_color_hover: #5666a4; pedastal_visible: false; diameter: 0.25; false; button_color: #7d7d7d; button_color_hover: #474747"
                        circles-interactive-object="click_sound: #button_press">
                        <a-entity text="value: Headset; align: center; width: 1.0; color: #dbdcff;" rotation="-90 -90 0" position="-0.12 0.11 0"></a-entity></a-entity>
            </a-entity>

            <!-- Buttons for general instructions -->
            <a-entity rotation="0 0 0" position="-0.660 0 -0.752">
              <a-entity id="infoInstructions" text="value: Info; align:center; width: 1; color: #dbdcff;" rotation="-90 -90 0" position="0.14 0.04 -0.001"></a-entity>
              
              <a-entity class="cutomButton">
                <a-entity id="infoInstructionsButton" scale="1 0.09 1" position="0 0.04 0" circles-interactive-object="highlight_color: #5666a4; click_sound: #button_press" geometry="primitive: cylinder; radius: 0.09;" material="color: #303a64" animation="property: position; from: 0 -0.01 0; to: 0 0.04 0; dur: 400; startEvents: click">
                  <a-entity text="value: ?; align:center; width: 3; color: #4deaff" rotation="-90 -90 0" position="0 0.55 0"></a-entity>
                </a-entity>
              </a-entity>

            </a-entity>
            
            <!-- Buttons for teleport pad toggles -->
            <a-entity rotation="0 0 0" position="0 0 0.670">
              <a-entity text="value: Teleport Pad Mode; align:center; width: 1; color: #dbdcff;" rotation="-90 -90 0" position="0.12 0.04 -0.123"></a-entity>
              
              <a-entity class="cutomButton" position="0 0.040 -0.25" >
                <a-entity id="opaqueTeleportPadSetting" scale="1 0.4 1" circles-interactive-object sound="src: #button_press; on: click;" geometry="primitive: cylinder; radius: 0.075; height: 0.21;" material="color: #7d7d7d" animation__mouseenter="property: components.material.material.color; type: color; to: #474747; startEvents: mouseenter; dur: 200" animation__mouseleave="property: components.material.material.color; type: color; to: #7d7d7d; startEvents: mouseleave; dur: 200" animation__click="property: position; to: 0 -0.02 0; dur: 200; startEvents: click"></a-entity>
                <a-entity text="value: Opaque; align: center; width: 1.0; color: #dbdcff;" rotation="-90 -90 0" position="-0.12 0 0"></a-entity>
              </a-entity>

              <a-entity class="cutomButton" position="0 0.040 0.036" >
                <a-entity id="transparentTeleportPadSetting" scale="1 0.4 1" circles-interactive-object sound="src: #button_press; on: click;"  geometry="primitive: cylinder; radius: 0.075; height: 0.21;" material="color: #7d7d7d" animation__mouseenter="property: components.material.material.color; type: color; to: #474747; startEvents: mouseenter; dur: 200" animation__mouseleave="property: components.material.material.color; type: color; to: #7d7d7d; startEvents: mouseleave; dur: 200" animation__click="property: position; to: 0 -0.02 0; dur: 200; startEvents: click"></a-entity>
                <a-entity text="value: Transparent; align: center; width: 1.0; color: #dbdcff;" rotation="-90 -90 0" position="-0.12 0 0"></a-entity>
              </a-entity>
            </a-entity>
  
            <!-- Buttons for glow toggles -->
            <a-entity rotation="0 0 0" position="-0.327 0 0.670">
              <a-entity text="value: Glow; align:center; width: 1; color: #dbdcff;" rotation="-90 -90 0" position="0.12 0.04 -0.263"></a-entity>

              <a-entity class="cutomButton" position="0 0.040 -0.25" >
                <a-entity id="bloomOnSetting" scale="1 0.4 1" circles-interactive-object sound="src: #button_press; on: click;"  geometry="primitive: cylinder; radius: 0.075; height: 0.21;" material="color: #7d7d7d" animation__mouseenter="property: components.material.material.color; type: color; to: #474747; startEvents: mouseenter; dur: 200" animation__mouseleave="property: components.material.material.color; type: color; to: #7d7d7d; startEvents: mouseleave; dur: 200" animation__click="property: position; to: 0 -0.02 0; dur: 200; startEvents: click"></a-entity>
                <a-entity text="value: On; align: center; width: 1.0; color: #dbdcff;" rotation="-90 -90 0" position="-0.12 0 0"></a-entity>
              </a-entity>

              <a-entity class="cutomButton" position="0 0.040 0.036" >
                <a-entity id="bloomOffSetting" scale="1 0.4 1" circles-interactive-object sound="src: #button_press; on: click;"  geometry="primitive: cylinder; radius: 0.075; height: 0.21;" material="color: #7d7d7d" animation__mouseenter="property: components.material.material.color; type: color; to: #474747; startEvents: mouseenter; dur: 200" animation__mouseleave="property: components.material.material.color; type: color; to: #7d7d7d; startEvents: mouseleave; dur: 200" animation__click="property: position; to: 0 -0.02 0; dur: 200; startEvents: click"></a-entity>
                <a-entity text="value: Off; align: center; width: 1.0; color: #dbdcff;" rotation="-90 -90 0" position="-0.12 0 0"></a-entity>
              </a-entity>

            </a-entity>
  
            <!-- Buttons for guiding text toggles -->
            <a-entity rotation="0 0 0" position="-0.657 0 0.670">
              <a-entity text="value: Guiding Text; align:center; width: 1; color: #dbdcff;" rotation="-90 -90 0" position="0.12 0.04 -0.193"></a-entity>
                <a-entity class="customButton" position="0 0.040 -0.25" >
                  <a-entity id="guidingTextOnSetting" scale="1 0.4 1" circles-interactive-object sound="src: #button_press; on: click;"  geometry="primitive: cylinder; radius: 0.075; height: 0.21;" material="color: #7d7d7d" animation__mouseenter="property: components.material.material.color; type: color; to: #474747; startEvents: mouseenter; dur: 200" animation__mouseleave="property: components.material.material.color; type: color; to: #7d7d7d; startEvents: mouseleave; dur: 200" animation__click="property: position; to: 0 -0.02 0; dur: 200; startEvents: click"></a-entity>
                  <a-entity text="value: On; align: center; width: 1.0; color: #dbdcff;" rotation="-90 -90 0" position="-0.12 0 0"></a-entity>
                </a-entity>

                <a-entity class="cutomButton" position="0 0.040 0.036" >
                  <a-entity id="guidingTextOffSetting" scale="1 0.4 1" circles-interactive-object sound="src: #button_press; on: click;"  geometry="primitive: cylinder; radius: 0.075; height: 0.21;" material="color: #7d7d7d" animation__mouseenter="property: components.material.material.color; type: color; to: #474747; startEvents: mouseenter; dur: 200" animation__mouseleave="property: components.material.material.color; type: color; to: #7d7d7d; startEvents: mouseleave; dur: 200" animation__click="property: position; to: 0 -0.02 0; dur: 200; startEvents: click"></a-entity>
                  <a-entity text="value: Off; align: center; width: 1.0; color: #dbdcff;" rotation="-90 -90 0" position="-0.12 0 0"></a-entity>
                </a-entity>
            </a-entity>
          </a-entity>

    <!-- ground & sky -->
    <a-entity id="ground" rotation="-90 0 0" geometry="primitive:circle; radius:10.0;" material="color:rgb(190,140,210);" shadow="cast:false; receive:true;"></a-entity>
    <a-entity id="sky" geometry="primitive:sphere; radius:100.0;"  material="src:#skyMap; shader:flat; flatShading:true; side:back;"></a-entity>

  </a-scene>

  <!-- Circles' end scripts [REQUIRED] -->
  <circles-end-scripts/>
 </body>
</html>
